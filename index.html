<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chapter 3 Cybersecurity Vocab Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Kalam:wght@400;700&display=swap');

  :root{
    --board-green: #1f3d2b;
    --board-green-dark: #16291d;
    --chalk-white: #f4f1e8;
    --chalk-yellow: #f2d675;
    --chalk-blue: #8fc7e8;
    --chalk-pink: #e8a3b5;
    --frame-brown: #6b4a2f;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--board-green-dark);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.02) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.02) 0, transparent 40%);
    font-family: 'Patrick Hand', cursive;
    color: var(--chalk-white);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 24px 12px 60px;
  }

  .board{
    width:100%;
    max-width: 900px;
    background: var(--board-green);
    border: 14px solid var(--frame-brown);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.35);
    padding: 24px 20px 32px;
  }

  h1{
    font-family: 'Kalam', cursive;
    text-align:center;
    font-size: 2.1rem;
    margin: 4px 0 2px;
    letter-spacing: 0.5px;
    text-shadow: 0 0 6px rgba(244,241,232,0.25);
  }

  .subtitle{
    text-align:center;
    color: var(--chalk-blue);
    margin: 0 0 18px;
    font-size: 1.1rem;
  }

  .stats{
    display:flex;
    justify-content:center;
    gap: 24px;
    margin-bottom: 18px;
    font-size: 1.15rem;
    flex-wrap: wrap;
  }
  .stats span b { color: var(--chalk-yellow); }

  .controls{
    display:flex;
    justify-content:center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  button.chalk-btn{
    font-family: 'Patrick Hand', cursive;
    font-size: 1.05rem;
    background: transparent;
    color: var(--chalk-white);
    border: 2px dashed var(--chalk-white);
    border-radius: 8px;
    padding: 8px 18px;
    cursor: pointer;
    transition: all .15s ease;
  }
  button.chalk-btn:hover{
    background: rgba(244,241,232,0.12);
    transform: translateY(-1px);
  }

  .game-area{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 24px;
  }
  @media (max-width: 640px){
    .game-area{ grid-template-columns: 1fr; }
  }

  .col-label{
    text-align:center;
    font-family:'Kalam', cursive;
    color: var(--chalk-pink);
    font-size: 1.15rem;
    margin-bottom: 6px;
    grid-column: span 1;
  }

  .card{
    border: 2px solid rgba(244,241,232,0.5);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    font-size: 1.05rem;
    line-height: 1.3;
    min-height: 54px;
    display:flex;
    align-items:center;
    background: rgba(244,241,232,0.03);
    transition: all .15s ease;
    user-select:none;
  }
  .card:hover{ background: rgba(244,241,232,0.1); }

  .card.term{ font-family:'Kalam', cursive; font-weight:700; color: var(--chalk-yellow); }
  .card.def{ color: var(--chalk-white); }

  .card.selected{
    background: rgba(143,199,232,0.25);
    border-color: var(--chalk-blue);
    box-shadow: 0 0 10px rgba(143,199,232,0.4);
  }
  .card.correct{
    background: rgba(120, 200, 120, 0.25);
    border-color: #78c878;
    color: #cdf5cd;
    cursor: default;
    animation: pop .3s ease;
  }
  .card.wrong{
    animation: shake .35s ease;
    border-color: #e07a7a;
    background: rgba(224,122,122,0.2);
  }
  .card.matched-hidden{
    visibility: hidden;
  }

  @keyframes pop{
    0%{ transform: scale(1); }
    50%{ transform: scale(1.03); }
    100%{ transform: scale(1); }
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    75%{ transform: translateX(6px); }
  }

  .win-message{
    display:none;
    text-align:center;
    margin-top: 22px;
    font-family:'Kalam', cursive;
    font-size: 1.6rem;
    color: var(--chalk-yellow);
    text-shadow: 0 0 8px rgba(242,214,117,0.4);
  }

  footer{
    margin-top: 18px;
    color: rgba(244,241,232,0.5);
    font-size: 0.85rem;
    text-align:center;
  }
</style>
</head>
<body>

<div class="board">
  <h1>🔐 Chapter 3: Cybersecurity Vocabulary</h1>
  <p class="subtitle">Match each term to its definition</p>

  <div class="stats">
    <span>Matches: <b id="matchCount">0</b> / <b id="totalCount">0</b></span>
    <span>Attempts: <b id="attemptCount">0</b></span>
    <span>Time: <b id="timer">0:00</b></span>
  </div>

  <div class="controls">
    <button class="chalk-btn" onclick="newGame()">🔄 New Game / Shuffle</button>
  </div>

  <div class="game-area" id="gameArea"></div>

  <div class="win-message" id="winMessage"></div>

  <footer>Charles Page High School — Cybersecurity | Click a term, then click its matching definition</footer>
</div>

<script>
const VOCAB = [
  { term: "Authentication", def: "Proving you are who you say you are, using a password, PIN, or fingerprint." },
  { term: "Public Key", def: "The half of a key pair that can be shared with anyone who needs to verify a signature." },
  { term: "Integrity", def: "Making sure your data is trustworthy and free from tampering." },
  { term: "MAC", def: "A short code used to check that a message hasn't been altered and really came from who it says it did." },
  { term: "Non-Repudiation", def: "The inability for a person, system, or computer to deny responsibility for an action or transaction." },
  { term: "Availability", def: "Ensuring that authorized users can access information and resources when they need it." },
  { term: "Audit Logs", def: "Detailed, tamper-resistant records of who did what and when on a system." },
  { term: "Time Stamping", def: "Cryptographically locking an action to the exact moment it happened, so it can't be disputed later." },
  { term: "Identification", def: "Showing something, like a student ID or username, to let a system know who you are." },
  { term: "Confidentiality", def: "Involves the efforts of an organization to make sure data is kept secret or private." },
  { term: "Authorization", def: "What you're allowed to do once a system has verified who you are." }
];

let selectedTerm = null;
let selectedDef = null;
let matches = 0;
let attempts = 0;
let timerInterval = null;
let seconds = 0;
let lockBoard = false;

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(s){
  const m = Math.floor(s/60);
  const sec = String(s % 60).padStart(2,'0');
  return `${m}:${sec}`;
}

function startTimer(){
  clearInterval(timerInterval);
  seconds = 0;
  document.getElementById('timer').textContent = formatTime(seconds);
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = formatTime(seconds);
  }, 1000);
}

function newGame(){
  matches = 0;
  attempts = 0;
  selectedTerm = null;
  selectedDef = null;
  lockBoard = false;
  document.getElementById('matchCount').textContent = matches;
  document.getElementById('attemptCount').textContent = attempts;
  document.getElementById('totalCount').textContent = VOCAB.length;
  document.getElementById('winMessage').style.display = 'none';

  const terms = shuffle(VOCAB.map(v => v.term));
  const defs = shuffle(VOCAB.map(v => v.def));

  const gameArea = document.getElementById('gameArea');
  gameArea.innerHTML = `
    <div class="col-label">Terms</div>
    <div class="col-label">Definitions</div>
  `;

  terms.forEach(term => {
    const el = document.createElement('div');
    el.className = 'card term';
    el.textContent = term;
    el.dataset.value = term;
    el.onclick = () => selectTerm(el, term);
    gameArea.appendChild(el);
  });

  defs.forEach(def => {
    const el = document.createElement('div');
    el.className = 'card def';
    el.textContent = def;
    el.dataset.value = def;
    el.onclick = () => selectDef(el, def);
    gameArea.appendChild(el);
  });

  // Re-order into two visual columns using CSS grid auto-flow column would
  // reorder oddly with mismatched counts, so we interleave via order style.
  const cards = Array.from(gameArea.children).slice(2);
  cards.forEach((c, i) => {
    c.style.order = i;
  });

  startTimer();
}

function findAnswer(term){
  return VOCAB.find(v => v.term === term).def;
}

function selectTerm(el, term){
  if(lockBoard || el.classList.contains('correct')) return;
  if(selectedTerm) selectedTerm.el.classList.remove('selected');
  selectedTerm = { el, value: term };
  el.classList.add('selected');
  tryMatch();
}

function selectDef(el, def){
  if(lockBoard || el.classList.contains('correct')) return;
  if(selectedDef) selectedDef.el.classList.remove('selected');
  selectedDef = { el, value: def };
  el.classList.add('selected');
  tryMatch();
}

function tryMatch(){
  if(!selectedTerm || !selectedDef) return;
  lockBoard = true;
  attempts++;
  document.getElementById('attemptCount').textContent = attempts;

  const correctDef = findAnswer(selectedTerm.value);
  if(correctDef === selectedDef.value){
    selectedTerm.el.classList.remove('selected');
    selectedDef.el.classList.remove('selected');
    selectedTerm.el.classList.add('correct');
    selectedDef.el.classList.add('correct');
    matches++;
    document.getElementById('matchCount').textContent = matches;
    selectedTerm = null;
    selectedDef = null;
    lockBoard = false;

    if(matches === VOCAB.length){
      clearInterval(timerInterval);
      const msg = document.getElementById('winMessage');
      msg.textContent = `🎉 All matched! Time: ${formatTime(seconds)} | Attempts: ${attempts}`;
      msg.style.display = 'block';
    }
  } else {
    selectedTerm.el.classList.add('wrong');
    selectedDef.el.classList.add('wrong');
    setTimeout(() => {
      selectedTerm.el.classList.remove('selected','wrong');
      selectedDef.el.classList.remove('selected','wrong');
      selectedTerm = null;
      selectedDef = null;
      lockBoard = false;
    }, 600);
  }
}

newGame();
</script>

</body>
</html>
